<template id="guide-content">
  <h1>Guide: what the tests look like and how to beat them</h1>
  <p class="lede">Everything below comes from IE's own admissions pages plus what applicants and Aon-format prep sites report. IE does not publish the exact item counts for every module, so treat the counts as the best available estimate and the techniques as the point.</p>

  <h2>1. The formats, from IE's own examples</h2>
  <p>IE's admissions-test page links a "Practical example" video for each section. Those videos are Aon's official demos, and Aon publishes practice-task PDFs for the same tests. Every mock in this site follows those sources item for item.</p>
  <div class="tablewrap"><table class="data">
    <thead><tr><th>Section</th><th>Bachelor: IE University Admissions Test</th><th>Master: ieGAT</th><th>Exactly what you see</th></tr></thead>
    <tbody>
      <tr><td>Numerical reasoning</td><td>37 tasks, 12 min</td><td>Yes (IE's example)</td><td>One company. Five data sheets on icon tabs: a costs table in thousands, a donut of revenue shares with the total underneath, a lead-generation table, a stacked bar chart of employees "in thousands", and a horizontal grouped bar chart of forecasts. Each statement relates to one sheet: True, False or Cannot say. Pen, paper and a calculator are allowed.</td></tr>
      <tr><td>Verbal reasoning</td><td>49 tasks, 12 min</td><td>Yes (IE's example)</td><td>One company. Six text tabs that stay on screen (About the company, Products, Values, Strategy, Locations, Marketing), each with two or three labelled paragraphs. Each statement relates to one tab: True, False or Cannot say.</td></tr>
      <tr><td>Deductive logical thinking</td><td>6 min, as many as you can</td><td>Commonly reported</td><td>Aon gapChallenge: a 4×4 or 5×5 grid of coloured symbols (circle, star, cross, triangle, square); each symbol once per row and column; pick the symbol for the ? cell from the row below. It gets harder as you go.</td></tr>
      <tr><td>Learning efficiency</td><td>10 tasks, 5 min</td><td>Not shown</td><td>Aon short-term memory test: simple objects appear one after another in the middle of the screen; then eight objects are shown and you select the ones you saw, in order.</td></tr>
      <tr><td>Mathematics assessment</td><td>12 questions, 15 min (BBA, BIE, PPLE); 20 questions, 60 min (maths, science, data programmes)</td><td>No</td><td>Multiple choice with four options plus "I don't know the answer", which neither adds nor deducts. The 15-minute sample covers expanding and simplifying, radical and rational equations, linear and quadratic inequalities, limits, derivatives and definite integrals. The 60-minute version adds complex numbers, matrices, vectors, planes, trigonometry, probability and the normal distribution.</td></tr>
      <tr><td>Inductive reasoning</td><td>Not listed</td><td>Yes (IE's example)</td><td>Aon scales ix: nine objects in a row, eight follow a rule (rotation, repeating counts, alternating shading, number of sides, containment), pick the one that does not. 20 tasks in 5 minutes, rising difficulty.</td></tr>
    </tbody>
  </table></div>
  <ul>
    <li>Before each scored section the real test gives untimed instructions and example tasks you can repeat as often as you like. Use them to settle, not to rush.</li>
    <li>One attempt only. English (Spanish for the ieGAT). Machine-proctored online: laptop with camera and microphone, not a phone or tablet; stay in view the whole time; do not switch windows.</li>
    <li>IE describes scoring as correct answers, time per question and penalties for wrong answers, weighted by programme. There is no published pass mark and you do not receive a score.</li>
  </ul>

  <h2>Difficulty setting</h2>
  <div class="card"><p>By default every module runs about a quarter harder than the official practice tasks, with the real time limits: numerical margins of 1 to 3 points instead of 2 to 6 and almost half of the statements needing two steps; verbal sets that lead with the inference statements; deductive grids that start three levels in and reach 5×5 sooner; memory sequences of four to seven objects shown for 0.8 s instead of three to six at 1 s; inductive rows that use 45° rotations and denser objects; maths with mixed-sign expansions, chain-rule derivatives, strict inequalities and no-solution radicals. Switch to "Official example level" in Drills or Mock to practise at the published level, for example on day 5.</p></div>

  <h2>2. Scoring strategy</h2>
  <div class="card">
    <p><b>The rule that matters most:</b> a wrong answer costs you, a skipped item does not. So the target is the highest number of items you can answer at roughly 85% accuracy or better, not the highest number of items touched.</p>
    <ol>
      <li><b>First pass at speed.</b> Statements: decide within about 15 seconds. If a statement needs a three-step calculation, skip it and come back if time remains.</li>
      <li><b>Never guess blind.</b> If you have no idea, leave it. If you have narrowed to two options on a 50/50, it is marginally positive to answer; on three or five options it is not.</li>
      <li><b>Watch the clock at the halfway mark.</b> If you have reached fewer than 40% of the items at 6 minutes, speed up and skip harder statements.</li>
      <li><b>Keep going to the last second.</b> Difficulty may adapt upwards as you get items right. Later items are not worth less.</li>
    </ol>
  </div>

  <h2>3. True / False / Cannot say: the decision rules</h2>
  <div class="card">
    <ul>
      <li><b>True</b> only if the information states it or it follows by simple arithmetic or logic from what is stated.</li>
      <li><b>False</b> only if the information contradicts it. "The text says X, the statement says not-X."</li>
      <li><b>Cannot say</b> when the information is silent, even if the statement is obviously true in the real world. Outside knowledge is poison.</li>
      <li>Modal words are the trap: <i>may, must, only, all, always, never, usually, most</i>. "Staff may work remotely up to three days" does not make "staff must work remotely three days" true. It makes it false.</li>
      <li>Scope words are the second trap: a figure given for one period or one subgroup says nothing about another period or subgroup. "Share of new orders" is not "share of revenue".</li>
      <li>A reason is never implied: the text says a policy exists; whether it exists <i>because</i> of something is Cannot say.</li>
      <li>Cannot say is not the safe answer. If you choose it more than about a third of the time you are probably under-reading the tabs. Re-scan once for the keyword before you commit.</li>
    </ul>
  </div>

  <h2>4. Numerical: make it mechanical</h2>
  <div class="card">
    <ol>
      <li>Read the statement first. Underline (mentally) the entity, the period and the comparison. Then open the tab that holds that entity.</li>
      <li>Check the unit row. Thousands, millions, percentages, per-unit figures.</li>
      <li>Pick the cheapest check: for "higher than" compare two cells; for "more than X% of total" compute X% of the total, not the share; for "increased by more than k%" compute old × (1 + k/100) and compare with new.</li>
      <li>Mental shortcuts: 10% is a shift of the decimal point, 5% is half of that, 1% is two shifts. 15% = 10% + 5%. 12.5% is one eighth. Doubling then halving beats long multiplication.</li>
      <li>Cannot say in numerical tests means the quantity is not in any tab: a future period, a quantity never given (profit when only revenue is shown), a breakdown not shown, or a per-period figure when only a single total is given.</li>
      <li>Round aggressively when the margin is wide; compute exactly only when the two sides are within about 5% of each other.</li>
    </ol>
  </div>

  <h2>5. Deductive grids</h2>
  <div class="card">
    <ol>
      <li>Look at the ? cell's row and column and list the symbols already present. Whatever remains are the candidates.</li>
      <li>One candidate left: answer. Two left: find a row or column crossing the ? cell's row or column that has one empty cell; fill it; repeat.</li>
      <li>A symbol missing from the ? cell's row must go in one of that row's empty cells. If every other empty cell in the row is blocked for that symbol by its column, the symbol belongs in the ? cell.</li>
      <li>Do not solve the whole grid. You only need the one cell.</li>
    </ol>
  </div>

  <h2>6. Inductive sets</h2>
  <div class="card">
    <ol>
      <li>Compare the three A figures with each other first and list everything they share: count of a symbol, letters versus digits, vowels, a position (centre, corners, a row), repeats, sums.</li>
      <li>Then check each shared property against the three B figures. The rule is the property every A has and no B has.</li>
      <li>Only then look at the four new figures. Test each one against the rule and assign.</li>
      <li>Common rules: exactly three of one character; only digits; only even digits; exactly two vowels; a vowel in the centre; a row of identical characters; exactly four letters; digits in all four corners; no repeated character; same character top-left and bottom-right; digit sum above a threshold; no digits in the middle column.</li>
    </ol>
  </div>

  <h2>7. Memory, inductive ix and maths</h2>
  <div class="card">
    <ul>
      <li><b>Memory:</b> name each object silently as it appears ("apple, lock, star") and keep repeating the chain while the grid loads. The grid shows eight objects; the ones you saw are mixed with lookalikes, so check the shape, not the general impression. Three objects to start, up to six later.</li>
      <li><b>Inductive ix:</b> read the row left to right and test the first rule that comes to mind on all nine before answering: rotation direction, a repeating count (1, 1, 2), alternating fill, number of sides, whether the inner shape is fully inside. Only one object breaks the rule.</li>
      <li><b>Maths:</b> expand with FOIL and check the sign of the middle term; factor the difference of two squares before cancelling; square both sides for radical equations and check the result; multiply out rational equations; quadratic inequality ≤ 0 means between the roots; limits of (x² − a²)/(x − a) cancel to x + a; product-rule derivatives are quicker if you multiply out first; integrate term by term. Use "I don't know" rather than guessing: it costs nothing, a wrong answer does.</li>
    </ul>
  </div>

  <h2>8. Kira online assessment</h2>
  <div class="card">
    <ul>
      <li>Three live questions: two video responses and one written. About 20 to 30 minutes. A short preparation window per question, roughly 60 to 90 seconds per video answer and a few minutes for the written one. Unlimited practice questions on the platform, one attempt per official question. Complete it within a week of the invitation.</li>
      <li>IE's own reflection prompts: Why IE? Why this programme? A recent personal challenge and how you responded. What you have done outside school to prepare. Key challenges in your field. How you will use your studies later in life. Prepare these as bullet points, not scripts.</li>
      <li><b>Video answer shape (90 s):</b> direct answer in one sentence; one specific story or two reasons with concrete detail; one-line takeaway tied to IE. Stop when done.</li>
      <li><b>Written answer shape (5 min):</b> answer in the first sentence; one reason with an example; a second reason or a counterpoint you address; a closing sentence about what it means for you at IE. 120 to 200 words; re-read once.</li>
      <li><b>Setup:</b> laptop at eye level, light in front of you, plain background, quiet room, wired or strong Wi-Fi, business-casual clothes, water nearby, notes allowed on paper but do not read from them.</li>
      <li>Your Kira answers may be referenced if you later get an interview. Stay consistent with your application essays.</li>
    </ul>
  </div>

  <h2>9. Test-day checklist</h2>
  <div class="card">
    <ul>
      <li>Valid photo ID that matches your application name.</li>
      <li>Laptop on mains power, camera and microphone working, browser updated, pop-up blockers and VPN off, other apps closed.</li>
      <li>Quiet room, desk cleared, nobody entering. Tell people at home.</li>
      <li>Paper and pen if permitted by the proctoring rules shown at check-in; basic calculator only if the instructions allow it.</li>
      <li>Water, a light meal an hour before, bathroom before you start. No breaks once started.</li>
      <li>Open the test 15 minutes early. Read the on-screen rules. Use the example questions to learn the interface.</li>
      <li>Strategy card: statements in 15 seconds or skip; never guess blind; check the clock at halfway; keep going to the last second.</li>
    </ul>
  </div>
